spring.application.name=socioclub
server.port=8080
# La sesión (usada por los mensajes flash) viaja solo en cookie, nunca como ;jsessionid en la URL
server.servlet.session.tracking-modes=cookie

# --- Conexión a MySQL (contenedor de docker-compose.yml, puerto 3307) ---
spring.datasource.url=jdbc:mysql://localhost:3307/socioclub?serverTimezone=America/Argentina/Cordoba&characterEncoding=UTF-8
spring.datasource.username=socioclub
spring.datasource.password=socioclub123

# --- JPA / Hibernate ---
# Las tablas y los datos los crea database/socioclub.sql, por eso Hibernate no toca el esquema.
spring.jpa.hibernate.ddl-auto=none
# Muestra en consola el SQL que genera Hibernate (útil para explicar los métodos derivados)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Thymeleaf ---
# Sin caché: los cambios en las plantillas se ven al recargar la página
spring.thymeleaf.cache=false
